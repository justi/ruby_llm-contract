inherit_from: .rubocop_todo.yml

AllCops:
  inherit_mode:
    merge:
      - Exclude
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'internal/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  # Listed here rather than in .rubocop_todo.yml because `inherit_mode: merge` is
  # scoped to AllCops, so a per-cop Exclude REPLACES the inherited one. Anything
  # this cop must skip has to be named in this block.
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'
    # RSpec matcher DSL: the blocks ARE the public interface, so splitting them
    # to satisfy a line count would make the matchers harder to read, not easier.
    - 'lib/ruby_llm/contract/rspec/pass_eval.rb'

Metrics/MethodLength:
  Max: 25

Layout/LineLength:
  Max: 120

Style/OneClassPerFile:
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'

Lint/UnusedBlockArgument:
  Exclude:
    - 'spec/**/*'

Naming/VariableNumber:
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'

Metrics/ClassLength:
  Max: 140

Metrics/ModuleLength:
  Max: 150

Metrics/AbcSize:
  Max: 30

Metrics/ParameterLists:
  Max: 12
  MaxOptionalParameters: 10

Style/FormatStringToken:
  Enabled: false
